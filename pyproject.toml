[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byovd-scanner"
version = "0.1.0"
description = "Vulnerable driver discovery tool for BYOVD research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["security", "driver", "byovd", "vulnerability", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "pefile>=2023.2.7",
    "yara-python>=4.3.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
ida = [
    "idapython-stubs>=8.3",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
byovd-scan = "byovd_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/abbey/byovd-scanner"
Repository = "https://github.com/abbey/byovd-scanner"
Issues = "https://github.com/abbey/byovd-scanner/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/byovd_scanner"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
